<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geomora Workspace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Geomora Workspace</div>
    <div class="subtitle">Phase 3 — Semantic Detection</div>
    <div id="status" class="status">Ready</div>
  </header>

  <main class="layout">
    <aside class="panel sources">
      <h2>Sources</h2>
      <button id="btn-pick-image" class="btn">Load Reference Image</button>
      <button id="btn-rectify" class="btn">Rectify Facade</button>
      <button id="btn-detect" class="btn">Detect Elements</button>
      <button id="btn-load-template" class="btn secondary">Load Phase 0 Template</button>
      <div class="view-toggle">
        <button id="btn-view-original" class="btn secondary active" type="button">Original</button>
        <button id="btn-view-rectified" class="btn secondary" type="button">Rectified</button>
        <button id="btn-view-overlay" class="btn secondary" type="button">Overlay</button>
      </div>
      <div id="detect-meta" class="meta">Detection: not run</div>
      <div id="rectify-meta" class="meta">Rectification: not run</div>
      <div id="source-meta" class="meta">No image loaded</div>
    </aside>

    <section class="panel viewer">
      <h2>Image Viewer</h2>
      <div class="viewer-frame" id="viewer-frame">
        <div id="image-stack" class="image-stack" hidden>
          <img id="reference-image" alt="Reference facade image" draggable="false">
          <svg id="detection-overlay" class="detection-overlay" aria-hidden="true"></svg>
        </div>
        <div id="viewer-toolbar" class="viewer-toolbar" hidden>
          <button id="btn-draw-window" class="btn secondary" type="button">Draw window</button>
          <button id="btn-delete-selected" class="btn secondary" type="button" disabled>Delete selected</button>
          <span id="viewer-hint" class="viewer-hint">Click a box to select · Del to remove</span>
        </div>
        <div id="viewer-placeholder" class="placeholder">Load a facade photo for manual reference</div>
      </div>
    </section>

    <section class="panel elements">
      <h2>Elements</h2>
      <ul id="element-tree" class="tree"></ul>
    </section>

    <section class="panel inspector">
      <h2>Inspector</h2>
      <form id="facade-form" class="form">
        <label>Project name<input name="project_name" type="text"></label>
        <label>Wall length (mm)<input name="wall_length" type="number" step="1"></label>
        <label>Wall height (mm)<input name="wall_height" type="number" step="1"></label>
        <label>Wall thickness (mm)<input name="wall_thickness" type="number" step="1"></label>

        <div class="section-title">Windows</div>
        <div id="windows-container"></div>

        <div class="section-title">Door</div>
        <label>Door offset (mm)<input name="door_offset" type="number" step="1"></label>
        <label>Door width (mm)<input name="door_width" type="number" step="1"></label>
        <label>Door height (mm)<input name="door_height" type="number" step="1"></label>
      </form>
    </section>
  </main>

  <footer class="actions">
    <button id="btn-validate" class="btn">Validate</button>
    <button id="btn-generate" class="btn primary">Generate</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
